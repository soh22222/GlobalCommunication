# Build and deploy dist/ to surge.sh on every push to main.
# One-time setup: add repo secrets SURGE_LOGIN (surge account email) and
# SURGE_TOKEN (from `npx surge token`). Without them the deploy step is skipped.
name: Deploy to surge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
      SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy
        if: env.SURGE_TOKEN != ''
        run: npx --yes surge@0.23.1 ./dist globe-ab-proto-protopie.surge.sh
      - name: Skip notice
        if: env.SURGE_TOKEN == ''
        run: echo "::warning::SURGE_TOKEN secret not set — build passed, deploy skipped."
